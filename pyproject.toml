[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-chacha20-poly"
version = "1.0.0"
description = "ChaCha20-Poly1305 AEAD cipher from scratch"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "chacha20", "poly1305", "cryptography", "aead"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-chacha20-poly"
Repository = "https://github.com/ElNeMeR70/py-chacha20-poly"
